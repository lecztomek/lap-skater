name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CLI_VERSION: 0.8.4
  SDK_CONSTRAINT: ">=7.0.0"

jobs:
  build:
    # symulator Connect IQ wymaga libwebkit2gtk-4.0 (brak w Ubuntu 24.04)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: lap-skater   # Łyżwy (katalog główny)
            dir: .
            device: fr245m
          - app: rolki        # Rolki
            dir: rolki
            device: fr245m
          - app: rower-moc    # pole danych mocy do aktywności Rower (Fazua Ride 60)
            dir: rower
            device: fr55
    env:
      DEVICE: ${{ matrix.device }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check secrets
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Brak sekretów GARMIN_USERNAME / GARMIN_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install connect-iq-sdk-manager
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${CLI_VERSION}/connect-iq-sdk-manager-cli_${CLI_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" connect-iq-sdk-manager
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache SDK and devices
        uses: actions/cache@v4
        with:
          # bez tokenu logowania – tylko SDK i pliki urządzeń
          path: |
            ~/.Garmin/ConnectIQ/Sdks
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-${{ matrix.device }}-${{ matrix.app }}-${{ github.run_id }}
          restore-keys: ciq-${{ matrix.device }}-

      - name: Download SDK and device
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          # Opcjonalnie: hash przeczytanej umowy SDK (zmienna repozytorium). Bez niej akceptowana jest bieżąca.
          AGREEMENT_HASH: ${{ vars.GARMIN_AGREEMENT_HASH }}
        run: |
          # wklejanie z telefonu potrafi dodać spacje / nowe linie
          GARMIN_USERNAME="$(printf '%s' "$GARMIN_USERNAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          GARMIN_PASSWORD="$(printf '%s' "$GARMIN_PASSWORD" | tr -d '\r\n')"
          export GARMIN_USERNAME GARMIN_PASSWORD
          case "$GARMIN_USERNAME" in *@*) at=tak ;; *) at=nie ;; esac
          echo "Login: ${#GARMIN_USERNAME} znaków, zawiera @: $at"
          connect-iq-sdk-manager agreement view
          if [ -n "$AGREEMENT_HASH" ]; then
            connect-iq-sdk-manager agreement accept --agreement-hash="$AGREEMENT_HASH"
          else
            connect-iq-sdk-manager agreement accept
          fi
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$SDK_CONSTRAINT"
          connect-iq-sdk-manager device download --manifest=manifest.xml --include-fonts
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Developer key
        env:
          DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            # Bez stałego klucza build działa, ale kolejnych wersji nie da się wgrać jako aktualizacji w sklepie.
            echo "::warning::Brak sekretu DEVELOPER_KEY_B64 – używam jednorazowego klucza."
            openssl genrsa -out key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
            rm key.pem
          fi

      - name: Unit tests (symulator)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libusb-1.0-0 libsecret-1-0 libwebkit2gtk-4.0-37 libjpeg-turbo8 libsm6 > /dev/null
          mkdir -p out
          monkeyc -f monkey.jungle -d "$DEVICE" -y developer_key.der -o out/test.prg --unit-test -w
          # symulator potrzebuje ekranu – wirtualny (xvfb)
          xvfb-run -a bash -c '
            connectiq &
            # symulator startuje kilkadziesiąt sekund – ponawiamy połączenie
            for i in $(seq 1 12); do
              sleep 10
              timeout 900 monkeydo out/test.prg "$DEVICE" -t > run.log 2>&1
              cat run.log
              grep -q "Unable to connect to simulator" run.log || break
              echo "Symulator jeszcze nie gotowy (próba $i)"
            done
          ' 2>&1 | tee test.log
          grep -qE "PASSED|Passed" test.log || { echo "::error::Brak wyniku testów"; exit 1; }
          if grep -qE "FAIL|ERROR" test.log; then echo "::error::Testy nie przeszły"; exit 1; fi

      - name: Build
        run: |
          mkdir -p out
          monkeyc --version
          # .prg – do wgrania kablem do GARMIN/APPS
          monkeyc -f monkey.jungle -d "$DEVICE" -y developer_key.der -o out/${{ matrix.app }}.prg -r -w
          # .iq – do wgrania w Connect IQ Store (beta)
          monkeyc -f monkey.jungle -e -y developer_key.der -o out/${{ matrix.app }}.iq -r -w
          rm developer_key.der out/test.prg* 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: |
            ${{ matrix.dir }}/out/${{ matrix.app }}.iq
            ${{ matrix.dir }}/out/${{ matrix.app }}.prg
            ${{ matrix.dir }}/test.log

  # Stały link do pobrania najnowszych wersji (także z iPhone'a): Releases → "Najnowszy build"
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find dist -type f
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build $(find dist -name '*.iq' -o -name '*.prg') \
            --title "Najnowszy build" --prerelease --target "$GITHUB_SHA" \
            --notes "Build z commita ${GITHUB_SHA::7}. lap-skater = Łyżwy, rolki = Rolki (FR245M), rower-moc = pole mocy do aktywności Rower (FR55). Plik .iq → Connect IQ Store (beta), .prg → GARMIN/APPS."
